[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-mlx-cpp"
version = "0.1.0"
description = "The NVIDIA Container Toolkit for Mac — GPU acceleration for any Docker container on Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "RobotFlow Labs", email = "dev@robotflowlabs.com" },
]
keywords = ["mlx", "docker", "gpu", "apple-silicon", "metal", "inference", "training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.27",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.22",
    "mlx-lm>=0.21",
]
vlm = [
    "mlx-vlm>=0.1.15",
]
audio = [
    "mlx-audio>=0.4.1",
]
embeddings = [
    "mlx-embeddings>=0.2",
]
all = [
    "docker-mlx-cpp[mlx,vlm,audio,embeddings]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
mlx-cpp = "cli.mlx_cpp:cli"

[project.urls]
Homepage = "https://github.com/RobotFlow-Labs/docker_mlx_cpp"
Documentation = "https://github.com/RobotFlow-Labs/docker_mlx_cpp#readme"
Repository = "https://github.com/RobotFlow-Labs/docker_mlx_cpp"
Issues = "https://github.com/RobotFlow-Labs/docker_mlx_cpp/issues"

[tool.setuptools.packages.find]
include = ["daemon*", "cli*", "sdk*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
